# Persistent fleet services for the always-on server (og128x01, Mac Pro).
# ONE published port (80): dashboard at /, mirror at /mirror. noVNC consoles
# connect browser->worker directly on each worker's ws port (not via here).
services:
  dashboard:
    build: { context: ../dashboard, dockerfile: Containerfile }
    image: macos-fleet-dashboard:local
    volumes: ["${DASH_DATA:-./dash-data}:/data"]
    restart: unless-stopped
    # no published port; reached only through the gateway

  gateway:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - "./gateway.conf:/etc/nginx/conf.d/default.conf:ro"
      - "${MIRROR_ROOT:-../mirror/data}:/srv/macos-recovery:ro"
    depends_on: [dashboard]
    restart: unless-stopped
