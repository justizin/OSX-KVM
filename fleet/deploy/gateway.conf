# Single entry point on :80. Dashboard at /, recovery-image mirror at /mirror.
server {
    listen 80;
    server_name _;

    # recovery images (static, large; ranges/resume matter on a flaky link)
    location = /mirror { return 301 /mirror/; }
    location /mirror/ {
        alias /srv/macos-recovery/;
        autoindex on;
        autoindex_format json;
        sendfile on; tcp_nopush on;
        add_header Accept-Ranges bytes;
    }

    # everything else -> dashboard app + ingest + noVNC (internal container)
    location / {
        proxy_pass http://dashboard:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 32m;   # allow PUT /shot/<id> screenshot uploads
    }
}
